services:
  fraud-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: fraud-detection-api:local
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=models/xgboost_fraud_model.pkl
      - FEATURE_COLUMNS_PATH=models/feature_columns.json
      - MODEL_VERSION=local-dev
      - THRESHOLD_OTP=0.30
      - THRESHOLD_REVIEW=0.60
      - THRESHOLD_BLOCK=0.85
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s